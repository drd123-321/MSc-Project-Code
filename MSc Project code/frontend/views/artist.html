<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Artist — Music App</title>

		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
			crossorigin="anonymous"
		/>

		<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

		<script src="../js/config.js"></script>
		<script src="../js/api.js"></script>
		<script src="../js/auth.js"></script>
		<script src="../js/artist.js"></script>

		<link rel="stylesheet" href="../css/artist.css" />
	</head>
	<body>
		<div class="page">
			<a href="../index.html" class="back-link">&larr; Back to home</a>

			<div class="artist-header">
				<div class="artist-header-circle"></div>
				<div>
					<h1 id="artistName">Loading…</h1>
					<div class="song-count" id="songCount"></div>
				</div>
			</div>

			<div class="section-label">Songs</div>
			<div id="songsList">
				<div class="empty-note">Loading songs…</div>
			</div>

			<div class="albums-section">
				<div class="section-label">Albums</div>
				<div id="albumsList">
					<div class="empty-note">Album grouping is coming soon.</div>
				</div>
			</div>
		</div>
	</body>
</html>
