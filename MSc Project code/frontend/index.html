<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Music App</title>

		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
			crossorigin="anonymous"
		/>

		<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>

		<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

		<script src="js/config.js" defer></script>
		<script src="js/auth.js" defer></script>
		<script src="js/api.js" defer></script>
		<script src="js/index.js" defer></script>

		<link rel="stylesheet" href="css/index.css" />
	</head>
	<body>
		<div class="app">
			<!-- Sidebar -->
			<div class="sidebar">
				<div class="username" id="usernameLabel">—</div>

				<div class="playlists" id="playlistsList">
					<div class="empty-note">Loading playlists…</div>
				</div>

				<button
					id="createPlaylistBtn"
					class="create-playlist-btn"
					data-bs-toggle="modal"
					data-bs-target="#createPlaylistModal"
				>
					+ Create playlist
				</button>

				<div class="sidebar-footer">
					<a id="myProfileLink">My profile</a>
					<a id="logoutLink">Log out</a>
				</div>
			</div>

			<div
				class="modal fade"
				id="createPlaylistModal"
				tabindex="-1"
				aria-hidden="true"
			>
				<div class="modal-dialog">
					<div class="modal-content">
						<div class="modal-header">
							<h5 class="modal-title">Create Playlist</h5>
							<button
								type="button"
								class="btn-close"
								data-bs-dismiss="modal"
							></button>
						</div>
						<div class="modal-body">
							<label for="playlistNameInput" class="modal-label"
								>Playlist name</label
							>
							<input
								type="text"
								id="playlistNameInput"
								class="modal-input"
								placeholder="My playlist"
							/>

							<label for="playlistSongSearch" class="modal-label"
								>Add songs (optional)</label
							>
							<div class="song-search-wrapper">
								<input
									type="text"
									id="playlistSongSearch"
									class="modal-input"
									placeholder="Search for a song to add"
									autocomplete="off"
								/>
								<div
									id="playlistSongSearchResults"
									class="song-search-results"
								></div>
							</div>

							<div id="selectedSongsList" class="selected-songs-list"></div>

							<div id="createPlaylistStatus" class="modal-status"></div>
						</div>
						<div class="modal-footer">
							<button
								type="button"
								class="btn-secondary"
								data-bs-dismiss="modal"
							>
								Cancel
							</button>
							<button
								type="button"
								id="submitCreatePlaylistBtn"
								class="btn-primary"
							>
								Create
							</button>
						</div>
					</div>
				</div>
			</div>

			<div
				class="modal fade"
				id="viewPlaylistModal"
				tabindex="-1"
				aria-hidden="true"
			>
				<div class="modal-dialog">
					<div class="modal-content">
						<div class="modal-header">
							<input
								type="text"
								id="playlistViewNameInput"
								class="modal-input playlist-name-input"
							/>
							<button
								type="button"
								class="btn-close"
								data-bs-dismiss="modal"
							></button>
						</div>
						<div class="modal-body">
							<div id="playlistSongsList" class="selected-songs-column">
								<div class="empty-note">Loading songs…</div>
							</div>

							<label for="playlistViewSongSearch" class="modal-label"
								>Add a song</label
							>
							<div class="song-search-wrapper">
								<input
									type="text"
									id="playlistViewSongSearch"
									class="modal-input"
									placeholder="Search for a song to add"
									autocomplete="off"
								/>
								<div
									id="playlistViewSongSearchResults"
									class="song-search-results"
								></div>
							</div>

							<div id="viewPlaylistStatus" class="modal-status"></div>
						</div>
						<div class="modal-footer">
							<button type="button" id="deletePlaylistBtn" class="btn-danger">
								Delete playlist
							</button>
							<button
								type="button"
								class="btn-secondary"
								data-bs-dismiss="modal"
							>
								Close
							</button>
						</div>
					</div>
				</div>
			</div>

			<!-- Main content -->
			<div class="main">
				<div class="top-row">
					<div style="position: relative">
						<input type="text" id="searchInput" placeholder="Search" />
						<div id="searchResults" class="search-results"></div>
					</div>
					<button id="uploadBtn">Upload song</button>
				</div>

				<div class="section-header-row">
					<div class="section-label">Artists</div>
					<a href="views/artists.html" class="browse-all-link">Browse all &rarr;</a>
				</div>

				<div
					id="artistsCarousel"
					class="carousel slide content-carousel"
					data-bs-ride="false"
				>
					<div class="carousel-inner" id="artistsCarouselInner">
						<!-- slides injected by JS -->
					</div>
					<button
						class="carousel-control-prev"
						type="button"
						data-bs-target="#artistsCarousel"
						data-bs-slide="prev"
					>
						<span class="carousel-control-prev-icon"></span>
					</button>
					<button
						class="carousel-control-next"
						type="button"
						data-bs-target="#artistsCarousel"
						data-bs-slide="next"
					>
						<span class="carousel-control-next-icon"></span>
					</button>
				</div>

				<div class="section-header-row">
					<div class="section-label">Songs</div>
					<a href="views/songs.html" class="browse-all-link">Browse all &rarr;</a>
				</div>

				<div
					id="songsCarousel"
					class="carousel slide content-carousel"
					data-bs-ride="false"
				>
					<div class="carousel-inner" id="songsCarouselInner">
						<!-- slides injected by JS -->
					</div>
					<button
						class="carousel-control-prev"
						type="button"
						data-bs-target="#songsCarousel"
						data-bs-slide="prev"
					>
						<span class="carousel-control-prev-icon"></span>
					</button>
					<button
						class="carousel-control-next"
						type="button"
						data-bs-target="#songsCarousel"
						data-bs-slide="next"
					>
						<span class="carousel-control-next-icon"></span>
					</button>
				</div>
			</div>

			<!-- Now playing bar -->
			<div class="now-playing">
				<div>
					<div class="now-playing-label">Now playing</div>
					<div class="now-playing-title" id="nowPlayingTitle">
						Nothing selected
					</div>
				</div>

				<div class="controls">
					<button id="prevBtn">&#171;</button>
					<button id="playPauseBtn">&#9654;</button>
					<button id="nextBtn">&#187;</button>
					<div class="progress-bar">
						<div class="progress-fill" id="progressFill"></div>
					</div>
				</div>

				<div class="now-playing-art"></div>
			</div>
		</div>

		<audio id="audioPlayer"></audio>
	</body>
</html>
